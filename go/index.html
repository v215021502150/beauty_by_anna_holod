<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FAF8F5">
<title data-en="How to find us — Beauty by Anna Holod" data-ru="Как добраться — Beauty by Anna Holod">How to find us — Beauty by Anna Holod</title>
<link rel="icon" type="image/x-icon" href="../images/favicon-pack/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../images/favicon-pack/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F5;
    --surface: #F5F0EA;
    --border: #E8DDD0;
    --text: #3D3530;
    --text-muted: #8C7B70;
    --accent: #C9A882;
    --cta: #8B5E4A;
    --cta-hover: #6B4535;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; -webkit-font-smoothing: antialiased; }
  body {
    font-family: 'Lato', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }

  /* HEADER — compact, single row */
  .topbar {
    flex-shrink: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
  }
  .topbar-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: center;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    text-decoration: none; color: var(--text);
  }
  .brand img { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; }
  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px; font-weight: 600; line-height: 1.1;
    white-space: nowrap;
  }
  .addr {
    display: flex; align-items: center; gap: 6px;
    color: var(--text-muted); font-size: 13px;
    min-width: 0; overflow: hidden;
  }
  .addr svg { color: var(--cta); flex-shrink: 0; }
  .addr-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .copy-btn {
    flex-shrink: 0; border: 1px solid var(--border); background: var(--bg);
    color: var(--text-muted); padding: 4px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .copy-btn:hover { background: var(--surface); border-color: var(--accent); color: var(--text); }
  .copy-btn.done { background: var(--cta); color: var(--white); border-color: var(--cta); }

  .lang { display: flex; gap: 2px; background: var(--surface); border-radius: 999px; padding: 2px; }
  .lang button {
    border: 0; background: transparent; padding: 5px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: var(--text-muted);
    cursor: pointer; font-family: inherit;
  }
  .lang button.active { background: var(--text); color: var(--bg); }

  /* MAIN CONTENT — fills remaining space */
  main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    padding: 10px 14px;
    gap: 10px;
    padding-bottom: calc(86px + env(safe-area-inset-bottom));
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .panel-label {
    padding: 8px 12px 6px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0;
  }
  .panel-label svg { width: 14px; height: 14px; color: var(--cta); }

  /* Map panel */
  .map-panel { height: 38vh; min-height: 220px; }
  .map-panel .panel-body { flex: 1; position: relative; }
  .map-panel iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* Parking panel */
  .parking-panel { min-height: 32vh; }
  .parking-panel .panel-body { flex: 1; }
  .parking-img { width: 100%; height: auto; display: block; }
  .parking-fallback {
    padding: 28px 16px; text-align: center;
    color: var(--text-muted); font-size: 13px;
    background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.02) 10px, rgba(0,0,0,0.02) 20px);
  }

  /* Desktop: two-column side by side */
  @media (min-width: 768px) {
    main {
      flex-direction: row;
      gap: 14px;
      padding: 14px;
      padding-bottom: calc(78px + env(safe-area-inset-bottom));
    }
    .panel { flex: 1; min-height: 0; }
    .map-panel { height: auto; }
    .parking-panel { min-height: 0; }
    .parking-panel .panel-body {
      display: flex; align-items: center; justify-content: center;
      background: var(--white);
      padding: 12px;
    }
    .parking-img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
  }

  /* Sticky CTA */
  .cta-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    z-index: 100;
    box-shadow: 0 -6px 20px rgba(61, 53, 48, 0.06);
  }
  .cta-bar-inner {
    max-width: 1200px;
    margin: 0 auto;
  }
  .cta-btn {
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 20px;
    background: var(--cta);
    color: var(--white);
    text-decoration: none;
    font-size: 16px; font-weight: 700; letter-spacing: 0.02em;
    border-radius: 10px;
    border: 0;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .cta-btn:hover { background: var(--cta-hover); }
  .cta-btn:active { transform: scale(0.98); }
  .cta-btn svg { width: 22px; height: 22px; }

  @media (min-width: 768px) {
    .cta-btn { max-width: 420px; margin: 0 auto; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <a href="../index.html" class="brand">
        <img src="../images/favicon-pack/apple-touch-icon.png" alt="Beauty by Anna Holod" width="32" height="32">
        <span class="brand-name">Beauty by Anna Holod</span>
      </a>
      <div class="addr">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z"/><circle cx="12" cy="11" r="3"/></svg>
        <span class="addr-text" id="addrText" data-en="Arch. Makarios III Ave 161, Limassol" data-ru="просп. Макариоса III, 161, Лимассол">Arch. Makarios III Ave 161, Limassol</span>
        <button type="button" class="copy-btn" id="copyBtn" data-en="Copy" data-ru="Копир.">Copy</button>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" class="active" data-lang="en">EN</button>
        <button type="button" data-lang="ru">RU</button>
      </div>
    </div>
  </div>

  <main>
    <div class="panel map-panel">
      <div class="panel-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.553 2.776A1 1 0 0022 18.882V8.118a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
        <span data-en="Salon location" data-ru="Расположение салона">Salon location</span>
      </div>
      <div class="panel-body">
        <iframe
          src="https://maps.google.com/maps?q=Beauty+by+Anna+Holod,+Limassol&z=17&output=embed"
          loading="eager"
          referrerpolicy="no-referrer-when-downgrade"
          title="Beauty by Anna Holod — Google Map"
          allowfullscreen></iframe>
      </div>
    </div>

    <div class="panel parking-panel">
      <div class="panel-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 17V7h4a3 3 0 010 6H9"/></svg>
        <span data-en="Parking" data-ru="Парковка">Parking</span>
      </div>
      <div class="panel-body">
        <img src="../images/parking.png" alt="Parking diagram" class="parking-img" id="parkingImg" onerror="this.style.display='none';document.getElementById('parkingFallback').style.display='block';">
        <div class="parking-fallback" id="parkingFallback" style="display:none">
          <span data-en="Parking diagram coming soon" data-ru="Схема парковки скоро появится">Parking diagram coming soon</span>
        </div>
      </div>
    </div>
  </main>

  <div class="cta-bar">
    <div class="cta-bar-inner">
      <a class="cta-btn" href="https://www.google.com/maps/dir/?api=1&destination=Beauty+by+Anna+Holod,+Arch.+Makarios+III+Ave+161,+Limassol" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
        <span data-en="Get directions in Google Maps" data-ru="Построить маршрут в Google Maps">Get directions in Google Maps</span>
      </a>
    </div>
  </div>

<script>
(function () {
  var STORAGE_KEY = 'bbah_lang';
  var saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  var browser = (navigator.language || 'en').slice(0, 2).toLowerCase();
  var lang = saved || (browser === 'ru' ? 'ru' : 'en');

  function applyLang(l) {
    document.documentElement.lang = l;
    var nodes = document.querySelectorAll('[data-en],[data-ru]');
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var val = n.getAttribute('data-' + l);
      if (val !== null) n.textContent = val;
    }
    var btns = document.querySelectorAll('.lang button');
    for (var j = 0; j < btns.length; j++) {
      btns[j].classList.toggle('active', btns[j].getAttribute('data-lang') === l);
    }
    try { localStorage.setItem(STORAGE_KEY, l); } catch (e) {}
  }

  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { applyLang(b.getAttribute('data-lang')); });
  });

  applyLang(lang);

  var copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    var addr = document.getElementById('addrText').textContent + ', 3090, Cyprus';
    var done = function () {
      copyBtn.classList.add('done');
      copyBtn.textContent = document.documentElement.lang === 'ru' ? 'OK' : 'OK';
      setTimeout(function () {
        copyBtn.classList.remove('done');
        copyBtn.textContent = document.documentElement.lang === 'ru' ? 'Копир.' : 'Copy';
      }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(addr).then(done).catch(function () {
        var ta = document.createElement('textarea');
        ta.value = addr; document.body.appendChild(ta);
        ta.select(); try { document.execCommand('copy'); } catch (e2) {}
        document.body.removeChild(ta); done();
      });
    } else {
      var ta = document.createElement('textarea');
      ta.value = addr; document.body.appendChild(ta);
      ta.select(); try { document.execCommand('copy'); } catch (e3) {}
      document.body.removeChild(ta); done();
    }
  });
})();
</script>
</body>
</html>
